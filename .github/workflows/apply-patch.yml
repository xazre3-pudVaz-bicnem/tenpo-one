# patch-inbox/** ブランチに *.patch（git format-patch --base=<sha> の出力）を置くと、
# その base-commit の上に git am で当てて、対象ブランチへ force push する。
# Claude の作業環境から GitHub へ直接 push できないときの搬入口。
# 出来たブランチから main への Pull Request は GitHub の画面で作って merge する。
#
# 使い方:
#   1. git format-patch --stdout --base=<mainの取り込み元sha> <sha>..HEAD > 0001-xxx.patch
#      大きいときは圧縮して base64 に: xz -9c 0001-xxx.patch | base64 -w76 > 0001-xxx.patch.xz.b64
#      （*.patch / *.patch.gz.b64 / *.patch.xz.b64 のどれでも可。圧縮版は CRC で壊れを検知できる）
#   2. patch-inbox/<名前> ブランチの直下に置く（ファイル名の昇順に当たる。追加分は 0002-... で足せる）
#   3. 対象ブランチ名は TARGET_BRANCH ファイル（1行）で指定。無ければ feat/inbox-<名前>
name: apply-patch-inbox
on:
  push:
    branches:
      - 'patch-inbox/**'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patches onto their base-commit and push the target branch
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p /tmp/inbox
          for f in *.patch; do cp "$f" "/tmp/inbox/$f"; done
          for f in *.patch.gz.b64; do base64 -d "$f" | gunzip -c > "/tmp/inbox/${f%.gz.b64}"; done
          for f in *.patch.xz.b64; do base64 -d "$f" | xz -dc > "/tmp/inbox/${f%.xz.b64}"; done
          patches=( /tmp/inbox/*.patch )
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "no patch in inbox yet"
            exit 0
          fi
          if [ -f TARGET_BRANCH ]; then
            BRANCH=$(head -1 TARGET_BRANCH | tr -d '[:space:]')
          else
            BRANCH="feat/inbox-${GITHUB_REF_NAME#patch-inbox/}"
          fi
          BASE=$(grep -h -m1 '^base-commit:' "${patches[@]}" | head -1 | awk '{print $2}')
          if [ -z "$BASE" ]; then
            echo "::error::patch に base-commit 行がありません（git format-patch --base=<sha> で作ってください）"
            exit 1
          fi
          git config user.name "tenpo-one patch bot"
          git config user.email "noreply@anthropic.com"
          git checkout -B "$BRANCH" "$BASE"
          git am --3way --ignore-whitespace "${patches[@]}"
          push_refspec="HEAD:refs/heads/$BRANCH"
          for attempt in 1 2 3; do
            if push_output=$(git push --force origin "$push_refspec" 2>&1); then
              echo "$push_output"
              break
            fi
            echo "$push_output"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            if ! grep -Fq "cannot lock ref 'refs/heads/$BRANCH': reference already exists" <<<"$push_output"; then
              exit 1
            fi
            echo "push failed on attempt $attempt; refreshing origin/$BRANCH and retrying..."
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
            sleep "$attempt"
          done
          echo "pushed $BRANCH at $(git rev-parse --short HEAD) (base $BASE)"
          git log --oneline "$BASE..HEAD"
